<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Strazz Robinhood MCP — tool graph over a market series">
  <defs>
    <radialGradient id="mGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#241a08" />
      <stop offset="60%" stop-color="#0c0a06" />
      <stop offset="100%" stop-color="#040404" />
    </radialGradient>
    <linearGradient id="mGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6420" />
      <stop offset="45%" stop-color="#d4a23d" />
      <stop offset="100%" stop-color="#ffeebc" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#mGlow)" />

  <!-- Market series behind the tool graph -->
  <polyline points="60,268 108,250 156,262 204,222 252,236 300,196 348,208 396,170 444,184 492,146 540,158 588,124"
            fill="none" stroke="url(#mGold)" stroke-width="2" opacity="0.5"
            stroke-linecap="round" stroke-linejoin="round" />

  <!-- A host connected to discrete MCP tools: read-only research on the left,
       gated execution on the right. -->
  <g stroke="url(#mGold)" stroke-width="1.3" opacity="0.7">
    <line x1="320" y1="150" x2="196" y2="106" />
    <line x1="320" y1="150" x2="248" y2="196" />
    <line x1="320" y1="150" x2="392" y2="196" />
    <line x1="320" y1="150" x2="444" y2="106" />
  </g>

  <g fill="#0a0a0d" stroke="url(#mGold)" stroke-width="1.6">
    <circle cx="196" cy="106" r="15" />
    <circle cx="248" cy="196" r="15" />
    <circle cx="392" cy="196" r="15" />
    <circle cx="444" cy="106" r="15" />
  </g>

  <circle cx="320" cy="150" r="26" fill="#0a0a0d" stroke="#ffeebc" stroke-width="2" />
  <circle cx="320" cy="150" r="7" fill="#ffeebc" opacity="0.9" />

  <text x="320" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="22" letter-spacing="4" fill="#ffeebc">MCP SERVER</text>

  <text x="320" y="330" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="500" font-size="12" letter-spacing="3.5" fill="#8a8378">
    RESEARCH · RISK CONTROLS · PAPER TRADING
  </text>
</svg>
