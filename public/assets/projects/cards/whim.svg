<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="WHIM — layered architecture">
  <defs>
    <radialGradient id="wGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#241a08" />
      <stop offset="60%" stop-color="#0c0a06" />
      <stop offset="100%" stop-color="#040404" />
    </radialGradient>
    <linearGradient id="wGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeebc" />
      <stop offset="50%" stop-color="#d4a23d" />
      <stop offset="100%" stop-color="#7a5316" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wGlow)" />

  <!-- Concentric layers, standing in for the clean-architecture partitioning:
       domain at the core, application, infrastructure, contracts outward. -->
  <g transform="translate(320 200)" fill="none" stroke="url(#wGold)">
    <rect x="-150" y="-95" width="300" height="190" rx="18" stroke-width="1" opacity="0.28" />
    <rect x="-114" y="-72" width="228" height="144" rx="15" stroke-width="1.2" opacity="0.45" />
    <rect x="-78" y="-49" width="156" height="98" rx="12" stroke-width="1.6" opacity="0.68" />
    <rect x="-42" y="-26" width="84" height="52" rx="9" stroke-width="2.2" opacity="1" />
  </g>

  <g transform="translate(320 200)" fill="#ffeebc" opacity="0.85">
    <circle cx="-150" cy="-95" r="2.6" />
    <circle cx="150" cy="-95" r="2.6" />
    <circle cx="-150" cy="95" r="2.6" />
    <circle cx="150" cy="95" r="2.6" />
  </g>

  <text x="320" y="207" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="700" font-size="26" letter-spacing="6" fill="#ffeebc">WHIM</text>

  <text x="320" y="352" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-weight="500" font-size="12" letter-spacing="3.5" fill="#8a8378">
    DOMAIN · APPLICATION · INFRASTRUCTURE
  </text>
</svg>
